name: CI

on:
  push:
    branches: [main, feat/*, fix/*]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Verify & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Check SEO content review
        run: node scripts/check-seo-changes.mjs
        env:
          SEO_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

      - name: Install Dependencies
        run: npm ci

      - name: Astro Type Check
        run: npm run check

      - name: Code Linting
        run: npm run lint

      - name: Unit Tests
        run: npm test

      - name: Static Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: E2E Tests
        run: npm run test:e2e
